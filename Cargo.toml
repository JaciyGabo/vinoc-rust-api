[package]
name = "vinoc-rust-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde_json = "1.0.151"
reqwest = { version = "0.13.4", features = ["json"] }
dotenvy = "0.15.7"
regex = "1.13.1"
uuid = { version = "1.24.0", features = ["v4"] }
